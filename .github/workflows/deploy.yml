name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

# Không chạy 2 deploy song song; không huỷ giữa chừng (receiver trên VPS đang thay container)
concurrency:
  group: deploy-cms-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/qkenn04/cms
  SERVER_URL: https://cms.qkenn.cloud

jobs:
  # 1. Kiểm tra + build image, đẩy lên GHCR. Hỏng ở đây → VPS không bị đụng.
  build:
    name: Kiểm tra + build image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test receiver deploy/rollback (docker/curl giả, không đụng VPS)
        run: bash scripts/test-deploy.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Cổng chất lượng — type check + unit test
        run: |
          set -euo pipefail
          corepack enable pnpm
          pnpm i --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm exec vitest run --config ./vitest.config.mts tests/int/triggerSiteRebuild.int.spec.ts tests/int/slugify.int.spec.ts tests/int/htmlConverters.int.spec.ts tests/int/draftMarkdown.int.spec.ts

      - name: Build + push image lên GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker build --pull \
            --build-arg NEXT_PUBLIC_SERVER_URL="$SERVER_URL" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$SHA" \
            -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
          echo "✓ đã đẩy $IMAGE:$SHA"

  # 2. SSH vào VPS, gửi đúng 1 lệnh "deploy <sha>" cho forced command /usr/local/bin/qkenn-cms-deploy
  #    (bản sao root của scripts/deploy.sh — VPS không git pull, không chạy code lấy từ repo).
  #    Host key của VPS phải khớp secret SSH_KNOWN_HOSTS (thiếu → job FAIL, không bỏ qua xác minh).
  deploy:
    name: Deploy lên VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy lên VPS qua SSH
        env:
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY_B64:-}" ] || [ -z "${SSH_HOST:-}" ]; then
            echo "::warning::Chưa cấu hình secret SSH_KEY_B64/SSH_HOST — bỏ qua deploy (image vẫn đã lên GHCR)"
            exit 0
          fi
          if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::Thiếu secret SSH_KNOWN_HOSTS (host key public của VPS, dạng '<host> ssh-ed25519 AAAA…') — không deploy khi chưa xác minh được máy đích. Xem CLAUDE.md phần Deploy."
            exit 1
          fi
          if [[ ! $DEPLOY_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::github.sha không phải 40 ký tự hex: $DEPLOY_SHA"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "::error::SSH_KNOWN_HOSTS không có dòng nào cho SSH_HOST — cột đầu phải đúng giá trị của SSH_HOST"
            exit 1
          fi
          (umask 077 && printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key)
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1 || { echo "::error::SSH_KEY_B64 không phải private key hợp lệ"; exit 1; }
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              "${SSH_USER:-root}@$SSH_HOST" "deploy $DEPLOY_SHA" </dev/null

  # 3. Báo Discord mọi trường hợp
  notify:
    name: Báo kết quả về Discord
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gửi thẻ Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then echo "⏭  Chưa có DISCORD_WEBHOOK → bỏ qua"; exit 0; fi
          if [ "$DEPLOY_RESULT" = "success" ]; then TITLE="✅ CMS deploy thành công"; COLOR=3066993
          elif [ "$BUILD_RESULT" != "success" ]; then TITLE="❌ CMS build THẤT BẠI — VPS không bị đụng"; COLOR=15158332
          else TITLE="❌ CMS deploy THẤT BẠI"; COLOR=15158332; fi
          MSG="${COMMIT_MSG:-(chạy thủ công)}"; MSG="${MSG%%$'\n'*}"
          jq -n --arg t "$TITLE" --arg u "$RUN_URL" --arg m "$MSG" --arg s "${SHA:0:7}" --argjson c "$COLOR" \
            '{embeds:[{title:$t,url:$u,color:$c,description:$m,fields:[{name:"Commit",value:$s,inline:true}],footer:{text:"cms.qkenn.cloud"},timestamp:(now|todate)}]}' \
            > /tmp/discord.json
          curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @/tmp/discord.json "$WEBHOOK"
