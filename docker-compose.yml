# Stack production Payload CMS — chạy tại /root/cms trên VPS (git clone repo này + file .env).
# DB ở mạng "internal" (internal: true = không ra internet, không có cổng host).
# cms ở cả internal (nối db) + external (gọi R2, GitHub API; nhận request từ nginx).
name: cms

services:
  db:
    image: postgres:16-alpine
    container_name: cms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cms_pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cms:
    # Image do CI build; deploy.sh đặt IMAGE_TAG = commit SHA đang deploy.
    # Rollback: scripts/rollback.sh <sha>
    image: ghcr.io/qkenn04/cms:${IMAGE_TAG:-latest}
    container_name: cms-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXT_PUBLIC_SERVER_URL: https://cms.qkenn.cloud
    mem_limit: 1536m
    cpus: 1.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - internal
      - external
    ports:
      - "127.0.0.1:3002:3000"

networks:
  internal:
    internal: true
  external:
    driver: bridge

volumes:
  cms_pgdata:
    name: cms_pgdata
